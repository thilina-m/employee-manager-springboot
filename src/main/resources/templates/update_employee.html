<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1>Employee Management System</h1>
        <hr>
        <h2>Update Employee</h2>

        <form action="#" th:action="@{/saveEmployee}" th:object="${employee}" method="POST">
            
            <!-- Hidden ID field for update -->
            <input type="hidden" th:field="*{id}" />
            
            <!-- Full Name -->
            <input type="text" th:field="*{fullName}" placeholder="Employee Full Name" class="form-control mb-4 col-4">
            
            <!-- Email -->
            <input type="text" th:field="*{email}" placeholder="Employee Email" class="form-control mb-4 col-4">
            
            <!-- Department -->
            <input type="text" th:field="*{department}" placeholder="Employee Department" class="form-control mb-4 col-4">
            
            <!-- Phone -->
            <input type="text" th:field="*{phone}" placeholder="Employee Phone" class="form-control mb-4 col-4">
            
            <!-- Salary -->
            <input type="number" th:field="*{salary}" placeholder="Employee Salary" class="form-control mb-4 col-4" step="0.01">

            <button type="submit" class="btn btn-info col-2"> Update Employee</button>
        </form>

        <hr>
        <a th:href="@{/}"> Back to Employee List</a>
    </div>
</body>
</html>
